<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#ffffff; --bg-elev:#f8fafc; --surface:#ffffff;
    --text:#0f172a; --text-muted:#64748b; --border:#e2e8f0;
    --accent-from:#6366f1; --accent-to:#8b5cf6; --accent-solid:#6366f1;
    --shadow:0 4px 20px -2px rgba(15,23,42,0.08);
    --mono:'JetBrains Mono',monospace;
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Bengali',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  [lang="bn"]{font-family:'Noto Sans Bengali',sans-serif}
  main,footer{position:relative;z-index:1}

  /* ============ CSE MODE VARIABLES ============ */
  body.cse{
    --bg:#04090f; --bg-elev:#081019; --surface:#0a1622;
    --text:#e2f9e9; --text-muted:#7fa394; --border:#123041;
    --accent-from:#22c55e; --accent-to:#22d3ee; --accent-solid:#4ade80;
    --shadow:0 0 24px rgba(34,197,94,0.12);
    font-family:var(--mono),'Noto Sans Bengali',monospace;
  }
  body.cse::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
    background-size:56px 56px;}
  body.cse h1,body.cse h2,body.cse h3,body.cse h4,body.cse .nav-link,body.cse button{font-family:var(--mono),'Noto Sans Bengali',monospace}

  .cse-only{display:none}
  body.cse .cse-only{display:revert}
  body.cse .clean-only{display:none}

  .accent-gradient{background-image:linear-gradient(135deg,var(--accent-from),var(--accent-to))}
  .accent-text{background-image:linear-gradient(135deg,var(--accent-from),var(--accent-to));-webkit-background-clip:text;background-clip:text;color:transparent}
  body.cse .logo-badge{box-shadow:0 0 18px rgba(74,222,128,.75)}
  .brand-cursor{animation:blink 1s steps(2) infinite;color:var(--accent-solid)}
  @keyframes blink{50%{opacity:0}}

  .site-header{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);
    background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);
    border-bottom:1px solid var(--border)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1.5rem;box-shadow:var(--shadow)}
  body.cse .card{position:relative;padding-top:3rem;overflow:hidden}
  body.cse .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2.25rem;
    background:#0a1420;border-bottom:1px solid var(--border);
    background-image:radial-gradient(circle 4px at 16px 50%,#ff5f56 97%,transparent),
                     radial-gradient(circle 4px at 34px 50%,#ffbd2e 97%,transparent),
                     radial-gradient(circle 4px at 52px 50%,#27c93f 97%,transparent);}

  .cta-primary{display:inline-flex;align-items:center;gap:.625rem;padding:.875rem 1.5rem;border-radius:.875rem;font-weight:600;color:#fff;background-image:linear-gradient(135deg,var(--accent-from),var(--accent-to));transition:transform .15s,box-shadow .15s;box-shadow:0 6px 20px -6px rgba(99,102,241,.55)}
  .cta-primary:hover{transform:translateY(-2px)}
  .cta-primary:focus-visible{outline:3px solid var(--accent-solid);outline-offset:3px}
  body.cse .cta-primary{color:#03150a;box-shadow:0 0 24px rgba(74,222,128,.55)}

  .cta-secondary{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.25rem;border-radius:.75rem;font-weight:500;color:var(--text);background:var(--surface);border:1px solid var(--border);transition:border-color .15s,transform .15s}
  .cta-secondary:hover{border-color:var(--accent-solid);transform:translateY(-1px)}
  body.cse .cta-secondary:hover{box-shadow:0 0 14px rgba(74,222,128,.35)}

  .notebook-hero{position:relative;overflow:hidden;border-radius:1.25rem;padding:2rem;background-image:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#fff}
  body.cse .notebook-hero{background-image:linear-gradient(135deg,#14532d,#0e7490);padding-top:3.5rem;box-shadow:0 0 34px rgba(34,197,94,.25)}
  body.cse .notebook-hero::after{content:"";position:absolute;top:0;left:0;right:0;height:2.5rem;background:rgba(4,10,16,.85);border-bottom:1px solid rgba(74,222,128,.25);
    background-image:radial-gradient(circle 4px at 16px 50%,#ff5f56 97%,transparent),
                     radial-gradient(circle 4px at 34px 50%,#ffbd2e 97%,transparent),
                     radial-gradient(circle 4px at 52px 50%,#27c93f 97%,transparent);}
  .notebook-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.22),transparent 40%);pointer-events:none}

  .coming-soon-card{border-radius:1.25rem;padding:2rem;text-align:center;background:repeating-linear-gradient(45deg,var(--bg-elev),var(--bg-elev) 10px,var(--surface) 10px,var(--surface) 20px);border:1px dashed var(--border)}

  .nav-link{color:var(--text);font-weight:500;padding:.5rem .875rem;border-radius:.5rem;transition:background .15s}
  .nav-link:hover{background:var(--bg-elev);color:var(--accent-solid)}
  body.cse .nav-link:hover{text-shadow:0 0 10px rgba(74,222,128,.8)}

  .dropdown{position:relative}
  .dropdown-menu{display:none;position:absolute;top:100%;left:0;min-width:270px;padding:.5rem;margin-top:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:.75rem;box-shadow:var(--shadow);z-index:40}
  .dropdown:hover>.dropdown-menu,.dropdown:focus-within>.dropdown-menu,.dropdown[data-open="true"]>.dropdown-menu{display:block}
  .dropdown-menu button{display:block;width:100%;text-align:left;padding:.5rem .75rem;border-radius:.5rem;color:var(--text);font-size:.9rem;background:transparent;border:0;cursor:pointer}
  .dropdown-menu button:hover{background:var(--bg-elev);color:var(--accent-solid)}

  .mobile-drawer{position:fixed;inset:0 0 0 auto;width:min(85vw,320px);background:var(--surface);transform:translateX(100%);transition:transform .25s;z-index:60;padding:1.5rem;overflow-y:auto;border-left:1px solid var(--border)}
  .mobile-drawer.open{transform:translateX(0)}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:55}
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .accordion-toggle{cursor:pointer;user-select:none}
  .accordion-content{display:none;padding-left:1rem;border-left:2px solid var(--border);margin-top:.25rem}
  .accordion-content.open{display:block}

  .tip-card{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.08));border:1px solid var(--border);border-radius:.875rem;padding:1.25rem}
  body.cse .tip-card{background:rgba(34,197,94,.06)}
  .icon-chip{width:2.5rem;height:2.5rem;border-radius:.75rem;display:inline-flex;align-items:center;justify-content:center;background-image:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.15));color:var(--accent-solid);font-size:1.25rem}
  body.cse .icon-chip{background-image:linear-gradient(135deg,rgba(74,222,128,.15),rgba(34,211,238,.15));text-shadow:0 0 10px rgba(74,222,128,.7)}

  .section-tag{font-size:.8rem;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;font-weight:600}
  body.cse .section-tag{text-transform:none;color:#4ade80;font-family:var(--mono)}
  body.cse .section-tag::before{content:"// "}

  /* terminal window (hero video chrome) */
  .term-bar{display:none;align-items:center;gap:6px;padding:.55rem .9rem;background:#0a1420;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--text-muted);font-family:var(--mono)}
  body.cse .term-bar{display:flex}
  .term-bar .dot{width:10px;height:10px;border-radius:9999px}
  .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .term-title{margin:0 auto}
  .term-line{display:none;padding:.75rem 1rem;background:#0a1420;font-family:var(--mono);font-size:.875rem;color:#e5e7eb}
  body.cse .term-line{display:block}
  body.cse .term-window{border:1px solid var(--border);border-radius:1rem;overflow:hidden;box-shadow:0 0 34px rgba(34,197,94,.18)}
  .video-wrapper{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:1rem;box-shadow:var(--shadow)}
  body.cse .video-wrapper{border-radius:0;box-shadow:none}
  .video-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* syntax token colors (CSE mode only) */
  body.cse .tk-o{color:#fbbf24}
  body.cse .tk-g{color:#4ade80}
  body.cse .tk-p{color:#c084fc}
  body.cse .tk-c{color:#22d3ee}
  .ln{color:var(--text-muted);opacity:.65;font-size:.72rem;margin-right:.6rem;user-select:none;font-family:var(--mono)}

  .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:.6rem;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .chip:hover{border-color:var(--accent-solid)}
  body.cse .chip{font-family:var(--mono)}
  body.cse .chip::before{content:"$ ";color:#4ade80}
  body.cse .chip:hover{box-shadow:0 0 14px rgba(74,222,128,.35)}

  .prompt-box{white-space:pre-wrap;background:var(--bg-elev);border:1px solid var(--border);border-radius:.75rem;padding:1.25rem;font-family:var(--mono);font-size:.875rem;line-height:1.7}
  body.cse .prompt-box{background:#0a1420;box-shadow:inset 0 0 24px rgba(34,211,238,.05)}

  footer a,footer button{color:var(--text-muted)}
  footer a:hover,footer button:hover{color:var(--accent-solid)}
</style>
</head>

        <a href="https://forms.gle/sf3hpQVvmB2iJHTY8" target="_blank" rel="noopener noreferrer" class="cta-secondary text-sm">Send feedback ↗</a>
      </div>
    </section>`;
  }
  return `
  <section class="max-w-5xl mx-auto px-4 py-12">
    <nav class="text-sm text-[var(--text-muted)] mb-6"><button data-route="home" class="hover:text-[var(--accent-solid)]">Home</button> / <span>${cs.semester} Semester CST</span> / <span class="text-[var(--text)] font-semibold">${cs.subject}</span></nav>
    <h1 class="text-3xl md:text-4xl font-bold mb-6">${cs.subject}</h1>
    ${tipGrid(4)}
    <div class="coming-soon-card mt-8">
      <div class="inline-flex items-center gap-3 mb-3">
        <div class="w-12 h-12 rounded-full bg-[var(--surface)] flex items-center justify-center text-2xl">🚧</div>
        <div class="text-left"><p class="text-xs uppercase tracking-wider text-[var(--text-muted)]">${cs.semester} Semester CST</p><h2 class="text-xl font-bold text-[var(--text)]">${cs.subject}</h2></div>
      </div>
      <p class="text-[var(--text-muted)] max-w-md mx-auto mb-4">This notebook is under construction. Send a note via the feedback form to be notified when it launches.</p>
      <button disabled class="px-5 py-2.5 rounded-xl font-semibold bg-[var(--border)] text-[var(--text-muted)] cursor-not-allowed">Coming Soon</button>
    </div>
    <div class="mt-10 text-center"><a href="https://forms.gle/sf3hpQVvmB2iJHTY8" target="_blank" rel="noopener noreferrer" class="cta-secondary text-sm">Request this subject ↗</a></div>
  </section>`;
}

function views_promptList(){
  return `
  <section class="max-w-5xl mx-auto px-4 py-16">
    <nav class="text-sm text-[var(--text-muted)] mb-6"><button data-route="home" class="hover:text-[var(--accent-solid)]">Home</button> / <span>Productivity Prompts</span></nav>
    <p class="section-tag mb-3">smart_study_promts</p>
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Smart study promts</h1>
    <p class="text-[var(--text-muted)] mb-4">Wanna self study using NotebookLM or other AI's? here's some promts that might help you.</p>
    <a href="${LIVE_PROMPTS_PAGE}" target="_blank" rel="noopener noreferrer" class="cta-secondary text-sm mb-10">View original page (embedded files) ↗</a>
    <div class="grid sm:grid-cols-2 gap-3 mt-8">
      ${PROMPTS.map(p=>'<button data-route="prompt" data-slug="'+p.slug+'" class="card text-left hover:border-[var(--accent-solid)] transition-colors flex justify-between items-center"><span class="font-semibold">'+p.title+'</span>'+arrowExt+'</button>').join('')}
    </div>
  </section>`;
}

function views_prompt(slug){
  const p = PROMPTS.find(x=>x.slug===slug);
  if(!p) return '<section class="max-w-5xl mx-auto px-4 py-16"><p>Prompt not found.</p></section>';
  return `
  <section class="max-w-4xl mx-auto px-4 py-16">
    <nav class="text-sm text-[var(--text-muted)] mb-6"><button data-route="home" class="hover:text-[var(--accent-solid)]">Home</button> / <button data-route="prompt-list" class="hover:text-[var(--accent-solid)]">Productivity Prompts</button> / <span class="text-[var(--text)]">${p.title}</span></nav>
    <h1 class="text-3xl md:text-4xl font-bold mb-6">${p.title}</h1>
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <span class="section-tag">prompt.txt</span>
        <button class="chip" data-copy="${p.slug}">copy</button>
      </div>
      <pre class="prompt-box">${p.prompt}</pre>
      <p class="text-xs text-[var(--text-muted)] mt-4">Source: <a href="${LIVE_PROMPTS_PAGE}" target="_blank" rel="noopener noreferrer" class="underline">diplomabyte — Productivity Promts</a> (original embedded files live here).</p>
    </div>
    <div class="mt-8"><button data-route="prompt-list" class="cta-secondary">← Back to all prompts</button></div>
  </section>`;
}

/* ---------- routing ---------- */
function navigate(route, slug){
  let html = views_home();
  if(route==='about') html = views_about();
  else if(route==='subject') html = views_subject(slug);
  else if(route==='prompt-list') html = views_promptList();
  else if(route==='prompt') html = views_prompt(slug);
  view.innerHTML = html;
  window.scrollTo(0,0);
}

document.addEventListener('click', async e => {
  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){
    const p = PROMPTS.find(x=>x.slug===copyBtn.dataset.copy);
    if(p){
      try{ await navigator.clipboard.writeText(p.prompt); }
      catch(_){ const ta=document.createElement('textarea'); ta.value=p.prompt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      const old = copyBtn.textContent; copyBtn.textContent='copied ✓'; setTimeout(()=>copyBtn.textContent=old,1200);
    }
    return;
  }
  const scrollBtn = e.target.closest('[data-scroll]');
  if(scrollBtn){ const el=document.getElementById(scrollBtn.dataset.scroll); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
  const nav = e.target.closest('[data-route]');
  if(nav){
    navigate(nav.dataset.route, nav.dataset.slug);
    document.getElementById('mobile-drawer').classList.remove('open');
    document.getElementById('drawer-backdrop').classList.remove('open');
  }
});

/* ---------- build prompts dropdown from data ---------- */
document.getElementById('dd-prompts').innerHTML =
  PROMPTS.map(p=>'<li><button data-route="prompt" data-slug="'+p.slug+'">'+p.title+'</button></li>').join('');

/* ---------- CSE mode toggle (replaces dark mode) ---------- */
const MODE_KEY = 'diplomabyte-mode';
function applyMode(m){ document.body.classList.toggle('cse', m==='cse'); localStorage.setItem(MODE_KEY, m); }
applyMode(localStorage.getItem(MODE_KEY) || 'clean');
document.getElementById('mode-toggle').addEventListener('click', () => {
  applyMode(document.body.classList.contains('cse') ? 'clean' : 'cse');
});

/* ---------- drawer / accordion / dropdown ---------- */
const drawer = document.getElementById('mobile-drawer');
const backdrop = document.getElementById('drawer-backdrop');
document.getElementById('hamburger-btn').addEventListener('click', ()=>{ drawer.classList.add('open'); backdrop.classList.add('open'); });
backdrop.addEventListener('click', ()=>{ drawer.classList.remove('open'); backdrop.classList.remove('open'); });
document.getElementById('drawer-close').addEventListener('click', ()=>{ drawer.classList.remove('open'); backdrop.classList.remove('open'); });
document.querySelectorAll('[data-close-drawer]').forEach(el=>el.addEventListener('click', ()=>{ drawer.classList.remove('open'); backdrop.classList.remove('open'); }));
document.querySelectorAll('.accordion-toggle').forEach(t=>t.addEventListener('click', ()=>t.nextElementSibling.classList.toggle('open')));
document.querySelectorAll('.dropdown > button').forEach(t=>t.addEventListener('click', e=>{
  if(window.innerWidth < 1024){
    e.preventDefault();
    const dd = t.closest('.dropdown');
    const was = dd.getAttribute('data-open')==='true';
    document.querySelectorAll('.dropdown[data-open]').forEach(d=>d.removeAttribute('data-open'));
    if(!was) dd.setAttribute('data-open','true');
  }
}));

/* ---------- init ---------- */
navigate('home');
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
